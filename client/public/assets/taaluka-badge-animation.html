<script>
    (function () {
      const items = document.querySelectorAll("#taalukaCutoutStage .taaluka-cutout");
      if (!items.length) return;

      let currentIndex = 0;
      const dwellDuration = 1.4;

      // Initialize all items hidden
      items.forEach((item) => {
        gsap.set(item, {
          opacity: 0,
          y: -100,
          scaleX: 0.6,
          scaleY: 0.6,
          filter: "blur(4px)",
          transformOrigin: "50% 50%"
        });
      });

      function playPopCycle() {
        const current = items[currentIndex];
        const nextIndex = (currentIndex + 1) % items.length;

        const tl = gsap.timeline();

        // 1. POP-IN ENTRY: Smooth friendly drop and elastic bounce
        tl.set(current, {
          opacity: 0,
          y: -100,
          scaleX: 0.6,
          scaleY: 0.6,
          rotate: 0,
          filter: "blur(4px)",
          transformOrigin: "50% 50%"
        })
        .to(current, {
          opacity: 1,
          y: 0,
          scaleX: 1,
          scaleY: 1,
          filter: "blur(0px)",
          duration: 0.55,
          ease: "back.out(1.4)"
        })
        // 2. DWELL / BREATHING: Subtle levitation
        .to(current, {
          y: -6,
          scaleX: 1.015,
          scaleY: 1.015,
          duration: dwellDuration * 0.5,
          ease: "sine.inOut"
        })
        .to(current, {
          y: 0,
          scaleX: 1.0,
          scaleY: 1.0,
          duration: dwellDuration * 0.5,
          ease: "sine.inOut"
        })
        // 3. MINIMAL EXIT: Smooth subtle downward slide with gentle slight narrowing/stretch, fading out straight down
        .set(current, {
          transformOrigin: "50% 70%"
        })
        .to(current, {
          y: 40,
          scaleX: 0.94,
          scaleY: 1.08,
          opacity: 0.85,
          duration: 0.22,
          ease: "power1.in"
        })
        .to(current, {
          y: 95,
          scaleX: 0.82,
          scaleY: 1.15,
          opacity: 0,
          filter: "blur(2px)",
          duration: 0.28,
          ease: "power2.in"
        })
        // 4. Smooth continuous looping across all badges
        .call(() => {
          currentIndex = nextIndex;
          playPopCycle();
        }, null, "+=0.1");
      }

      // Start on DOM Ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", playPopCycle);
      } else {
        playPopCycle();
      }
    })();
  </script>
