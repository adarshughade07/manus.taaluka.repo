[build]
  command = "pnpm install --frozen-lockfile && pnpm build:netlify"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  VITE_NETLIFY_STATIC = "true"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
